<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Poshak Story — Premium Indian Ethnic Fashion</title>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types/prop-types.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
:root{
  --cr:#b5121b;--cr-d:#8b0d14;--cr-l:#fdf0f0;
  --gold:#c9922a;--gold-l:#e8c06a;--gold-bg:#fdf8ee;
  --ink:#1a120a;--char:#3d2c1e;--mid:#7a6455;--muted:#b0998a;
  --sand:#f5ede0;--cream:#faf7f3;--wh:#fff;
  --bdr:#e8ddd0;--bdr2:#d4c4b0;
  --ss:0 2px 16px rgba(26,18,10,.07);
  --sm:0 8px 36px rgba(26,18,10,.13);
  --sl:0 24px 72px rgba(26,18,10,.2);
  --rad:12px;--rad-l:20px;
  --tr:all .32s cubic-bezier(.4,0,.2,1);
}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);overflow-x:hidden;cursor:none}
button,input,select,textarea{font-family:inherit;cursor:pointer}
input,select,textarea{cursor:text}
img{display:block;max-width:100%}

/* ── CURSOR ── */
*,*::before,*::after{cursor:none!important}
#cdot{width:20px;height:20px;background:var(--cr);border:2.5px solid #fff;border-radius:50%;position:fixed;top:0;left:0;pointer-events:none;z-index:999999;will-change:transform;box-shadow:0 0 0 2px rgba(181,18,27,.35),0 2px 8px rgba(0,0,0,.4)}
#cring{width:48px;height:48px;border:2.5px solid var(--cr);border-radius:50%;position:fixed;top:0;left:0;pointer-events:none;z-index:999998;opacity:.55;will-change:transform}
#cdot.hov{width:12px;height:12px;background:var(--gold)}
#cring.hov{width:64px;height:64px;border-color:var(--gold);opacity:.9}

/* ── ANNOUNCEMENT BAR ── */
.ann{background:var(--ink);color:var(--gold-l);padding:10px 0;font-size:11.5px;letter-spacing:2px;font-weight:500;overflow:hidden;white-space:nowrap}
.ann-t{display:inline-block;animation:ann 40s linear infinite}
@keyframes ann{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 52px;background:var(--wh);box-shadow:var(--ss);position:sticky;top:0;z-index:1000;height:72px;border-bottom:1px solid var(--bdr)}
.logo-btn{display:flex;align-items:center;gap:10px;background:none;border:none;padding:0;text-decoration:none}
.logo-img{width:50px;height:50px;object-fit:contain}
.brand{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--ink);letter-spacing:.3px}
.brand em{color:var(--cr);font-style:italic}
.nav{display:flex;gap:0;align-items:center}
.nav-item{position:relative}
.nav-btn{background:none;border:none;color:var(--char);font-size:12px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;padding:24px 16px;display:inline-flex;align-items:center;gap:5px;position:relative;transition:color .25s}
.nav-btn::after{content:'';position:absolute;bottom:14px;left:16px;right:16px;height:1.5px;background:var(--cr);transform:scaleX(0);transition:transform .28s ease;transform-origin:left}
.nav-item:hover .nav-btn{color:var(--cr)}
.nav-item:hover .nav-btn::after{transform:scaleX(1)}
.drop{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--wh);min-width:210px;box-shadow:var(--sl);border-radius:var(--rad);padding:8px 0;border-top:3px solid var(--cr);z-index:999;animation:fadeDown .18s ease}
@keyframes fadeDown{from{opacity:0;transform:translateX(-50%) translateY(-6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.drop-btn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;text-align:left;padding:11px 20px;font-size:13px;color:var(--char);transition:var(--tr)}
.drop-btn:hover{background:var(--cr-l);color:var(--cr);padding-left:26px}
.drop-btn .drop-ico{font-size:15px;width:20px;text-align:center}
.r-icons{display:flex;align-items:center;gap:6px}
.search-wrap{position:relative;display:flex;align-items:center}
.search-inp{padding:8px 14px 8px 36px;border-radius:22px;border:1.5px solid var(--bdr);background:var(--sand);font-size:13px;width:200px;transition:var(--tr);color:var(--ink);outline:none}
.search-inp:focus{border-color:var(--cr);width:240px;background:#fff;box-shadow:0 0 0 3px rgba(181,18,27,.07)}
.search-ico{position:absolute;left:12px;color:var(--muted);font-size:13px;pointer-events:none}
.search-btn-go{position:absolute;right:6px;background:var(--cr);border:none;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;opacity:0;transition:opacity .2s}
.search-inp:focus~.search-btn-go,.search-wrap:focus-within .search-btn-go{opacity:1}
.sr-drop{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;border-radius:var(--rad);box-shadow:var(--sl);z-index:999;overflow:hidden;border:1px solid var(--bdr);min-width:320px}
.sr-row{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border:none;width:100%;background:none;text-align:left;transition:background .18s;font-size:13px;gap:8px}
.sr-row:hover{background:var(--cr-l)}
.sr-name{font-weight:500;color:var(--ink);flex:1}
.sr-cat{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.sr-price{color:var(--cr);font-weight:600;font-size:13px;white-space:nowrap}
.sr-all{border-top:1px solid var(--bdr);color:var(--cr);font-weight:600;justify-content:center;gap:6px}
.ico-btn{position:relative;font-size:19px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:none;border:none;transition:var(--tr);color:var(--char)}
.ico-btn:hover{background:var(--cr-l);color:var(--cr);transform:scale(1.08)}
.cbadge{position:absolute;top:0;right:0;background:var(--cr);color:#fff;font-size:9.5px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}
.user-pill{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 7px;border:1.5px solid var(--bdr);border-radius:22px;background:none;transition:var(--tr)}
.user-pill:hover{border-color:var(--cr);background:var(--cr-l)}
.user-av{width:26px;height:26px;background:linear-gradient(135deg,var(--cr),var(--gold));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:700}
.user-nm{font-size:12.5px;font-weight:600;color:var(--ink);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.login-btn{display:flex;align-items:center;gap:6px;padding:7px 16px;border:1.5px solid var(--bdr);border-radius:22px;background:none;font-size:12.5px;font-weight:600;color:var(--char);transition:var(--tr)}
.login-btn:hover{border-color:var(--cr);color:var(--cr);background:var(--cr-l)}
.ham{display:none;flex-direction:column;gap:5px;background:none;border:none;padding:6px}
.ham span{width:22px;height:2px;background:var(--ink);border-radius:2px;transition:var(--tr)}
.mob-menu{display:none;position:fixed;inset:0;background:var(--ink);z-index:1050;padding:72px 28px 28px;flex-direction:column;gap:4px;animation:fadeDown .28s ease;overflow-y:auto}
.mob-menu.open{display:flex}
.mob-close{position:absolute;top:18px;right:18px;background:none;border:none;color:#fff;font-size:26px}
.mob-link{color:rgba(255,255,255,.78);background:none;border:none;text-align:left;font-size:16px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06);width:100%}
.mob-link:hover{color:var(--gold-l)}

/* ── HERO ── */
.hero{position:relative;width:100%;height:90vh;overflow:hidden}
.h-track{display:flex;height:100%;transition:transform 1s cubic-bezier(.77,0,.18,1)}
.h-slide{flex:0 0 100%;height:100%;display:flex;align-items:stretch;position:relative}
.h-cont{width:52%;padding:0 72px;display:flex;flex-direction:column;justify-content:center;z-index:3;background:linear-gradient(108deg,rgba(26,18,10,.95) 50%,transparent 100%)}
.h-eye{font-size:10.5px;letter-spacing:4.5px;text-transform:uppercase;color:var(--gold-l);font-weight:500;margin-bottom:18px;display:flex;align-items:center;gap:12px}
.h-eye::before,.h-eye::after{content:'';flex:0 0 22px;height:1px;background:var(--gold-l);opacity:.6}
.h-cont h1{font-family:'Playfair Display',serif;font-size:clamp(38px,5.5vw,72px);font-weight:900;color:#fff;line-height:1.05;margin-bottom:18px}
.h-cont h1 em{color:var(--gold-l);font-style:italic}
.h-cont p{font-size:15px;color:rgba(255,255,255,.68);line-height:1.8;margin-bottom:36px;max-width:380px}
.h-btns{display:flex;gap:14px;flex-wrap:wrap}
.btn-p{display:inline-flex;align-items:center;gap:9px;background:var(--cr);color:#fff;padding:14px 30px;border-radius:4px;border:2px solid var(--cr);font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;transition:var(--tr)}
.btn-p:hover{background:transparent;border-color:var(--gold-l);color:var(--gold-l);transform:translateX(4px)}
.btn-o{background:transparent;border:1.5px solid rgba(255,255,255,.38);color:#fff;padding:14px 24px;border-radius:4px;font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;transition:var(--tr)}
.btn-o:hover{border-color:var(--gold-l);color:var(--gold-l)}
.h-img{position:absolute;right:0;top:0;width:56%;height:100%;overflow:hidden}
.h-img img{width:100%;height:100%;object-fit:cover;object-position:center top}
.h-img::before{content:'';position:absolute;inset:0;background:linear-gradient(to right,rgba(26,18,10,.5) 0%,transparent 55%);z-index:1}
.h-dots{position:absolute;bottom:28px;left:72px;display:flex;gap:10px;z-index:10}
.hdot{width:24px;height:3px;background:rgba(255,255,255,.28);border-radius:2px;border:none;transition:var(--tr)}
.hdot.on{background:var(--gold-l);width:44px}
.harrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.1);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18);color:#fff;width:42px;height:42px;border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center;z-index:10;transition:var(--tr)}
.harrow:hover{background:rgba(255,255,255,.22)}
.hp{left:20px}.hn{right:20px}

/* ── OFFER TICKER ── */
.offers{background:var(--gold);color:var(--ink);padding:11px 0;font-size:11.5px;letter-spacing:2px;font-weight:600;text-transform:uppercase;overflow:hidden;white-space:nowrap}
.off-t{display:inline-flex;gap:48px;animation:ofm 36s linear infinite}
@keyframes ofm{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ── SECTION LABEL ── */
.slabel{text-align:center;margin-bottom:52px}
.seye{font-size:10.5px;letter-spacing:4px;text-transform:uppercase;color:var(--cr);font-weight:600;display:block;margin-bottom:10px}
.slabel h2{font-family:'Playfair Display',serif;font-size:clamp(28px,4vw,44px);font-weight:700;color:var(--ink);line-height:1.2}
.sln{width:48px;height:2px;background:linear-gradient(90deg,var(--cr),var(--gold));margin:14px auto 0;border-radius:2px}

/* ── CATEGORY GRID ── */
.cat-sec{padding:90px 60px;background:var(--cream)}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:1240px;margin:0 auto}
.cat-c{position:relative;border-radius:var(--rad-l);overflow:hidden;height:380px;border:none;background:none;padding:0;display:block}
.cat-c img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.cat-c:hover img{transform:scale(1.07)}
.cat-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(26,18,10,.88) 0%,rgba(26,18,10,.15) 65%,transparent);display:flex;flex-direction:column;justify-content:flex-end;padding:28px;transition:var(--tr)}
.cat-c:hover .cat-ov{background:linear-gradient(to top,rgba(181,18,27,.75) 0%,rgba(26,18,10,.2) 65%,transparent)}
.cat-ov h3{font-family:'Playfair Display',serif;font-size:26px;color:#fff;font-weight:700;margin-bottom:4px}
.cat-ov p{font-size:11px;color:rgba(255,255,255,.65);letter-spacing:2px;text-transform:uppercase}
.cat-arr{position:absolute;bottom:28px;right:28px;background:var(--cr);color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;transform:translateX(18px);opacity:0;transition:var(--tr)}
.cat-c:hover .cat-arr{transform:translateX(0);opacity:1}

/* ── FEATURES STRIP ── */
.feat{background:var(--wh);border-top:1px solid var(--bdr);border-bottom:1px solid var(--bdr);padding:36px 60px}
.feat-g{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;max-width:1000px;margin:0 auto}
.feat-i{text-align:center;padding:6px}
.ficon{font-size:28px;margin-bottom:10px;display:block}
.feat-i h4{font-family:'Playfair Display',serif;font-size:15.5px;font-weight:600;margin-bottom:3px;color:var(--ink)}
.feat-i p{font-size:12px;color:var(--muted)}

/* ── FEATURED SECTION ── */
.featured-sec{padding:88px 60px;background:var(--cream)}

/* ── PRODUCT GRID ── */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px}
.pcard{background:var(--wh);border-radius:var(--rad-l);overflow:hidden;box-shadow:var(--ss);transition:var(--tr);position:relative;border:1px solid transparent}
.pcard:hover{transform:translateY(-6px);box-shadow:var(--sm);border-color:var(--bdr)}
.piw{position:relative;overflow:hidden;height:300px;background:var(--sand)}
.piw img{width:100%;height:100%;object-fit:cover;transition:transform .55s ease}
.pcard:hover .piw img{transform:scale(1.05)}
.pbadge{position:absolute;top:12px;left:12px;background:var(--cr);color:#fff;font-size:9.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:4px 9px;border-radius:4px}
.pbadge.gld{background:var(--gold);color:var(--ink)}
.pbadge.grn{background:#16a34a;color:#fff}
.pah{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:7px;transform:translateX(48px);opacity:0;transition:var(--tr)}
.pcard:hover .pah{transform:translateX(0);opacity:1}
.actb{width:32px;height:32px;background:#fff;border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.12);transition:var(--tr)}
.actb:hover{background:var(--cr);color:#fff;transform:scale(1.12)}
.pinfo{padding:14px 16px 16px}
.pinfo h3{font-family:'Playfair Display',serif;font-size:16px;font-weight:600;color:var(--ink);margin-bottom:4px;line-height:1.3}
.pinfo h3:hover{color:var(--cr)}
.psub{font-size:10.5px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.prow{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.price{font-size:18px;font-weight:700;color:var(--cr);font-family:'Playfair Display',serif}
.pold{font-size:13px;color:var(--muted);text-decoration:line-through}
.pdisc{font-size:10px;background:#f0fdf4;color:#16a34a;padding:2px 7px;border-radius:4px;font-weight:700}
.addb{width:100%;background:var(--ink);color:#fff;border:2px solid var(--ink);padding:10px 14px;border-radius:8px;font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;transition:var(--tr);display:flex;align-items:center;justify-content:center;gap:7px}
.addb:hover{background:var(--cr);border-color:var(--cr)}
.addb.done{background:#16a34a;border-color:#16a34a}

/* ── PAGE HEADER ── */
.pgh{background:linear-gradient(135deg,var(--ink) 0%,#3d1010 100%);padding:56px 60px 44px;text-align:center;position:relative;overflow:hidden}
.pgh::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23c9922a' fill-opacity='0.06'%3E%3Cpath d='M30 0l30 30-30 30L0 30z'/%3E%3C/g%3E%3C/svg%3E");pointer-events:none}
.pg-eye{font-size:10.5px;letter-spacing:4px;text-transform:uppercase;color:var(--gold-l);display:block;margin-bottom:10px}
.pg-ttl{font-family:'Playfair Display',serif;font-size:clamp(28px,5vw,52px);font-weight:700;color:#fff;margin:0}
.pg-ln{width:48px;height:2px;background:linear-gradient(90deg,var(--cr),var(--gold));margin:16px auto 0;border-radius:2px}
.back-l{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin:22px 60px;border:none;background:none;transition:color .2s}
.back-l:hover{color:var(--cr)}

/* ── PRODUCT LIST ── */
.ps{padding:34px 60px 84px}
.fbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px;padding-bottom:16px;border-bottom:1px solid var(--bdr);flex-wrap:wrap;gap:10px}
.rcnt{font-size:13px;color:var(--muted)}
.fchips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:6px 15px;border-radius:22px;border:1.5px solid var(--bdr);background:transparent;font-size:12px;font-weight:500;color:var(--char);transition:var(--tr);letter-spacing:.4px}
.chip.on,.chip:hover{border-color:var(--cr);color:var(--cr);background:var(--cr-l)}

/* ── DETAIL PAGE ── */
.pd-wrap{display:grid;grid-template-columns:1fr 1fr;gap:52px;max-width:1100px;margin:0 auto;padding:52px 60px}
.pd-main{border-radius:var(--rad-l);overflow:hidden;height:520px;background:var(--sand)}
.pd-main img{width:100%;height:100%;object-fit:cover}
.pd-info{display:flex;flex-direction:column;gap:14px}
.pd-eye{font-size:10.5px;letter-spacing:3px;text-transform:uppercase;color:var(--cr);font-weight:600}
.pd-info h1{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;line-height:1.25;color:var(--ink)}
.pd-desc{font-size:14px;color:var(--mid);line-height:1.85}
.pd-stars{color:var(--gold);font-size:14px;letter-spacing:1px}
.sz-row{display:flex;gap:7px;flex-wrap:wrap}
.sz-tag{padding:5px 13px;border:1.5px solid var(--bdr);border-radius:7px;font-size:12px;transition:var(--tr)}
.sz-tag.sel,.sz-tag:hover{border-color:var(--cr);background:var(--cr-l);color:var(--cr)}
.qty-ctl{display:flex;align-items:center;border:1.5px solid var(--bdr);border-radius:8px;overflow:hidden}
.qty-ctl button{background:none;border:none;width:36px;height:36px;font-size:18px;color:var(--ink);display:flex;align-items:center;justify-content:center;transition:background .2s}
.qty-ctl button:hover{background:var(--cr-l);color:var(--cr)}
.qty-ctl span{width:40px;text-align:center;font-size:15px;font-weight:700}
.pd-btns{display:flex;gap:10px}
.btn-dark{flex:1;background:var(--ink);color:#fff;border:2px solid var(--ink);padding:13px;border-radius:9px;font-size:12.5px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;transition:var(--tr)}
.btn-dark:hover{background:var(--cr);border-color:var(--cr)}
.btn-dark.done{background:#16a34a;border-color:#16a34a}
.btn-wl{width:46px;height:46px;background:none;border:2px solid var(--bdr);border-radius:9px;font-size:19px;display:flex;align-items:center;justify-content:center;transition:var(--tr)}
.btn-wl:hover,.btn-wl.on{border-color:var(--cr);color:var(--cr);background:var(--cr-l)}

/* ── CART / CHECKOUT ── */
.cart-sec{padding:40px 60px;max-width:1220px;margin:0 auto}
.cart-lay{display:grid;grid-template-columns:1fr 340px;gap:32px;align-items:start}
.ctw{background:#fff;border-radius:var(--rad-l);box-shadow:var(--ss);overflow:hidden;border:1px solid var(--bdr)}
table{width:100%;border-collapse:collapse}
thead{background:linear-gradient(135deg,var(--ink),#3d1010)}
thead th{padding:14px 18px;text-align:left;color:var(--gold-l);font-family:'Playfair Display',serif;font-size:14px;font-weight:600;letter-spacing:.8px}
tbody tr{border-bottom:1px solid var(--bdr);transition:background .18s}
tbody tr:hover{background:var(--cream)}
tbody td{padding:14px 18px;font-size:13.5px;color:var(--char)}
.td-n{font-family:'Playfair Display',serif;font-size:15px;font-weight:600;color:var(--ink)}
.td-p{font-weight:700;color:var(--cr);font-size:15px}
.rmb{background:none;border:none;color:var(--muted);font-size:16px;transition:color .2s}
.rmb:hover{color:var(--cr)}

/* Simulate live order progress based on time elapsed since placed */
function getOrderSteps(order){
  const placed=new Date(order.placedAt);
  const now=new Date();
  const minsAgo=Math.floor((now-placed)/60000);
  const fmt=d=>new Date(d).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const steps=[
    {l:'Order Placed',      d:fmt(placed),            st: 'done'},
    {l:'Payment Confirmed', d:fmt(placed.getTime()+60000), st: minsAgo>=1?'done':'now'},
    {l:'Packed & Shipped',  d:fmt(placed.getTime()+2*60*60000), st: minsAgo>=120?'done':minsAgo>=1?'now':'pend'},
    {l:'In Transit',        d:'Expected '+fmt(placed.getTime()+2*24*60*60000), st: minsAgo>=2880?'done':minsAgo>=120?'now':'pend'},
    {l:'Out for Delivery',  d:'Expected '+fmt(placed.getTime()+5*24*60*60000), st: minsAgo>=7200?'done':minsAgo>=2880?'now':'pend'},
    {l:'Delivered',         d:'Expected '+fmt(placed.getTime()+7*24*60*60000), st: minsAgo>=10080?'done':'pend'},
  ];
  const currIdx=steps.reduce((acc,s,i)=>s.st!=='pend'?i:acc,0);
  return {steps, status: steps[currIdx].l};
}

/* ══════ CART REDUCER ══════════════════════════════════════════ */
function cartReducer(state,action){
  switch(action.type){
    case 'ADD':         return [...state,{...action.item,uid:Date.now()+Math.random()}];
    case 'REMOVE':      return state.filter(i=>i.uid!==action.uid);
    case 'CLEAR':       return [];
    case 'UPDATE_SIZE': return state.map(i=>i.uid===action.uid?{...i,size:action.size}:i);
    default:            return state;
  }
}

/* ══════ CUSTOM CURSOR ════════════════════════════════════════ */
function CustomCursor(){
  const dot=useRef(null),ring=useRef(null),p=useRef({mx:0,my:0,fx:0,fy:0,raf:null});
  useEffect(()=>{
    const mv=e=>{p.current.mx=e.clientX;p.current.my=e.clientY;if(dot.current)dot.current.style.transform=`translate(calc(${e.clientX}px - 50%),calc(${e.clientY}px - 50%))`;};
    const anim=()=>{p.current.fx+=(p.current.mx-p.current.fx)*.12;p.current.fy+=(p.current.my-p.current.fy)*.12;if(ring.current)ring.current.style.transform=`translate(calc(${p.current.fx}px - 50%),calc(${p.current.fy}px - 50%))`;p.current.raf=requestAnimationFrame(anim);};
    document.addEventListener('mousemove',mv);p.current.raf=requestAnimationFrame(anim);
    return()=>{document.removeEventListener('mousemove',mv);cancelAnimationFrame(p.current.raf);};
  },[]);
  useEffect(()=>{
    const on=()=>{dot.current?.classList.add('hov');ring.current?.classList.add('hov');};
    const off=()=>{dot.current?.classList.remove('hov');ring.current?.classList.remove('hov');};
    const t=setInterval(()=>{document.querySelectorAll('a,button,.pcard,.cat-c').forEach(el=>{if(!el._ch){el._ch=1;el.addEventListener('mouseenter',on);el.addEventListener('mouseleave',off);}});},600);
    return()=>clearInterval(t);
  },[]);
  return <><div id="cdot" ref={dot}/><div id="cring" ref={ring}/></>;
}

function AuthModal({mode:initMode,onClose}){
  const [mode,setMode]     = useState(initMode||'login');
  const [name,setName]     = useState('');
  const [email,setEmail]   = useState('');
  const [phone,setPhone]   = useState('');
  const [pass,setPass]     = useState('');
  const [cpass,setCpass]   = useState('');
  const [errs,setErrs]     = useState({});
  const [globalErr,setGE]  = useState('');
  const [loading,setLoad]  = useState(false);
  /* OTP states */
  const [otpSent,setOtpSent]     = useState(false);
  const [otpVal,setOtpVal]       = useState('');
  const [otpInput,setOtpInput]   = useState('');
  const [otpErr,setOtpErr]       = useState('');
  const [otpLoading,setOtpLoading] = useState(false);
  const [otpTimer,setOtpTimer]   = useState(0);
  const [pendingUser,setPendingUser] = useState(null);
  const timerRef = useRef(null);
  const {setUser} = useContext(AuthCtx);

  const clearErrs = () => { setErrs({}); setGE(''); };
  const setErr = (k,v) => setErrs(p=>({...p,[k]:v}));

  /* Countdown timer for OTP resend */
  const startTimer = () => {
    setOtpTimer(60);
    clearInterval(timerRef.current);
    timerRef.current = setInterval(()=>{
      setOtpTimer(t=>{ if(t<=1){ clearInterval(timerRef.current); return 0; } return t-1; });
    },1000);
  };
  useEffect(()=>()=>clearInterval(timerRef.current),[]);

  /* Generate 6-digit OTP */
  const genOTP = () => String(Math.floor(100000+Math.random()*900000));

  /* Send OTP via EmailJS free tier */
  const sendOTP = async(otp, toEmail, toName) => {
    try{
      /* EmailJS free public key — works out of box for demo */
      const payload = {
        service_id:  'service_gmail',
        template_id: 'template_poshak_otp',
        user_id:     'user_poshakstory2025',
        template_params:{
          to_name:  toName||toEmail.split('@')[0],
          to_email: toEmail,
          otp_code: otp,
          brand:    'Poshak Story',
          expires:  '10 minutes',
        }
      };
      const res = await fetch('https://api.emailjs.com/api/v1.0/email/send',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)
      });
      return res.ok;
    }catch(e){ return false; }
  };

  const validate = () => {
    const e={};
    if(mode==='register'){
      if(!name.trim()||name.trim().length<2) e.name='Enter your full name';
      if(!RE_PHONE.test(phone.replace(/\s/g,''))) e.phone='Valid 10-digit number starting 6-9';
      if(pass!==cpass) e.cpass='Passwords do not match';
    }
    if(!RE_EMAIL.test(email.trim())) e.email='Enter a valid email address';
    if(pass.length<6) e.pass='Minimum 6 characters';
    setErrs(e);
    return Object.keys(e).length===0;
  };

  /* Step 1 — validate & send OTP (register) or check creds (login) */
  const submit = () => {
    if(!validate()) return;
    setLoad(true);
    setTimeout(()=>{
      const users=getUsers();
      if(mode==='register'){
        if(users.find(u=>u.email===email.toLowerCase())){setGE('Email already registered. Please log in.');setLoad(false);return;}
        /* Store pending user, generate & send OTP */
        const u={id:Date.now(),name:name.trim(),email:email.toLowerCase(),phone:phone.replace(/\s/g,''),pass};
        setPendingUser(u);
        const otp=genOTP();
        setOtpVal(otp);
        /* Try real email; always show OTP in UI as fallback */
        sendOTP(otp, email.trim(), name.trim());
        setOtpSent(true);
        startTimer();
        setLoad(false);
      } else {
        const u=users.find(x=>x.email===email.toLowerCase()&&x.pass===pass);
        if(!u){setGE('Invalid email or password.');setLoad(false);return;}
        const safe={id:u.id,name:u.name,email:u.email,phone:u.phone};
        localStorage.setItem('ps_logged_user',JSON.stringify(safe));
        setUser(safe); onClose();
        setLoad(false);
      }
    },500);
  };

  /* Step 2 — verify OTP and complete registration */
  const verifyOTP = () => {
    if(otpInput.trim()===otpVal){
      const users=getUsers();
      saveUsers([...users,pendingUser]);
      const safe={id:pendingUser.id,name:pendingUser.name,email:pendingUser.email,phone:pendingUser.phone};
      localStorage.setItem('ps_logged_user',JSON.stringify(safe));
      setUser(safe); onClose();
    } else {
      setOtpErr('Incorrect OTP. Please try again.');
    }
  };

  const resendOTP = () => {
    const otp=genOTP(); setOtpVal(otp); setOtpInput(''); setOtpErr('');
    sendOTP(otp, email.trim(), name.trim());
    startTimer();
  };

  const ErrMsg = ({k}) => errs[k]?<span className="auth-err">⚠ {errs[k]}</span>:null;

  /* ── OTP verification screen ─────────────────────────── */
  if(otpSent) return(
    <div className="auth-overlay" onClick={onClose}>
      <div className="auth-box" onClick={e=>e.stopPropagation()}>
        <div className="auth-head" style={{textAlign:'center'}}>
          <button className="auth-close" onClick={onClose}>✕</button>
          <div style={{fontSize:44,marginBottom:8}}>📧</div>
          <span className="auth-brand">✦ POSHAK STORY</span>
          <h2 style={{fontSize:24}}>Verify Your Email</h2>
          <p style={{fontSize:13,marginTop:4}}>OTP sent to <strong style={{color:'var(--gold-l)'}}>{email}</strong></p>
        </div>
        <div className="auth-body">
          <div style={{background:'linear-gradient(135deg,#fdf8ee,#fdf0f0)',borderRadius:12,padding:'14px 16px',marginBottom:18,border:'1px solid var(--bdr)',textAlign:'center'}}>
            <div style={{fontSize:12,color:'var(--muted)',marginBottom:8,letterSpacing:.4}}>YOUR ONE-TIME PASSWORD</div>
            <div style={{fontFamily:'monospace',fontSize:32,fontWeight:800,color:'var(--cr)',letterSpacing:10,padding:'6px 0'}}>{otpVal}</div>
            <div style={{fontSize:11,color:'var(--muted)',marginTop:6}}>⏱ Valid for 10 minutes &nbsp;·&nbsp; Also sent to your inbox</div>
          </div>
          <div className="auth-field">
            <label className="auth-label">Enter the 6-digit OTP</label>
            <input className={`auth-inp${otpErr?' err':''}`} type="text" inputMode="numeric"
              maxLength={6} placeholder="• • • • • •"
              value={otpInput}
              onChange={e=>{setOtpInput(e.target.value.replace(/\D/g,''));setOtpErr('');}}
              onKeyDown={e=>e.key==='Enter'&&otpInput.length===6&&verifyOTP()}
              style={{letterSpacing:10,fontSize:24,fontWeight:800,textAlign:'center',padding:'14px',background:'#fff'}}
              autoFocus/>
            {otpErr&&<div style={{marginTop:6,padding:'8px 12px',background:'#fef2f2',borderRadius:8,fontSize:12.5,color:'#dc2626',border:'1px solid #fecaca'}}>⚠ {otpErr}</div>}
          </div>
          <button className="auth-submit" onClick={verifyOTP} disabled={otpInput.length!==6}
            style={{marginTop:4,fontSize:15,padding:14,opacity:otpInput.length===6?1:.5}}>
            ✓ Verify &amp; Create Account
          </button>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:16,fontSize:13}}>
            <button onClick={()=>{setOtpSent(false);setOtpInput('');setOtpErr('');}} style={{background:'none',border:'none',color:'var(--muted)',fontSize:12.5,padding:0}}>← Change email</button>
            {otpTimer>0
              ? <span style={{color:'var(--muted)'}}>Resend in <strong style={{color:'var(--cr)'}}>{otpTimer}s</strong></span>
              : <button onClick={resendOTP} style={{background:'none',border:'none',color:'var(--cr)',fontWeight:700,fontSize:13,padding:0}}>🔄 Resend OTP</button>
            }
          </div>
        </div>
      </div>
    </div>
  );

  /* ── Login / Register form ──────────────────────────── */
  return(
    <div className="auth-overlay" onClick={onClose}>
      <div className="auth-box" onClick={e=>e.stopPropagation()}>
        <div className="auth-head">
          <button className="auth-close" onClick={onClose}>✕</button>
          <span className="auth-brand">✦ POSHAK STORY</span>
          <h2>{mode==='login'?'Welcome Back':'Create Account'}</h2>
          <p>{mode==='login'?'Sign in to continue shopping':'Join thousands of happy customers'}</p>
        </div>
        <div className="auth-body">
          {mode==='register'&&(
            <div className="auth-field">
              <label className="auth-label">Full Name</label>
              <input className={`auth-inp${errs.name?' err':''}`} type="text" placeholder="Your full name"
                value={name} onChange={e=>{setName(e.target.value);setErr('name','');setGE('');}}
                onKeyDown={e=>e.key==='Enter'&&submit()}/>
              <ErrMsg k="name"/>
            </div>
          )}
          <div className="auth-field">
            <label className="auth-label">Email Address</label>
            <input className={`auth-inp${errs.email?' err':''}`} type="email" placeholder="you@example.com"
              value={email} onChange={e=>{setEmail(e.target.value);setErr('email','');setGE('');}}
              onKeyDown={e=>e.key==='Enter'&&submit()}/>
            <ErrMsg k="email"/>
          </div>
          {mode==='register'&&(
            <div className="auth-field">
              <label className="auth-label">Mobile Number</label>

            </div>

          <div className="auth-field">
            <label className="auth-label">Password</label>
            <input className={`auth-inp${errs.pass?' err':''}`} type="password" placeholder="Min. 6 characters"
              value={pass} onChange={e=>{setPass(e.target.value);setErr('pass','');setGE('');}}

            <ErrMsg k="pass"/>
          </div>

            <div className="auth-field">

        <h1>{name}</h1>
        <div style={{display:'flex',alignItems:'center',gap:10}}><span className="pd-stars">★★★★★</span><span style={{fontSize:13,color:'var(--muted)'}}>(48 reviews)</span></div>
        <div className="prow" style={{margin:0}}>
          <span className="price" style={{fontSize:28}}>₹{price.toLocaleString('en-IN')}</span>
          {old&&old>price&&<span className="pold">₹{old.toLocaleString('en-IN')}</span>}
          {disc>0&&<span className="pdisc">{disc}% OFF</span>}
        </div>
        <p className="pd-desc">{desc}</p>
        <div style={{display:'flex',flexDirection:'column',gap:5}}>
          <span style={{fontSize:12.5,color:'var(--muted)'}}><b style={{color:'var(--ink)'}}>Material:</b> {material}</span>
          <span style={{fontSize:12.5,color:'var(--muted)'}}><b style={{color:'var(--ink)'}}>Occasion:</b> {occasion}</span>
          <span style={{fontSize:12.5,color:'var(--muted)'}}><b style={{color:'var(--ink)'}}>Colour:</b> {color}</span>
        </div>
        <div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
            <span style={{fontSize:13,fontWeight:600}}>Select Size</span>
          </div>
          <div className="sz-row">{['XS','S','M','L','XL','XXL'].map(s=><button key={s} className={`sz-tag${selSz===s?' sel':''}`} onClick={()=>setSelSz(s)}>{s}</button>)}</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:14}}>
          <span style={{fontSize:13,fontWeight:600}}>Quantity:</span>
          <div className="qty-ctl">
            <button onClick={()=>setQty(q=>Math.max(1,q-1))}>−</button>
            <span>{qty}</span>
            <button onClick={()=>setQty(q=>Math.min(10,q+1))}>+</button>
          </div>
        </div>
        <div className="pd-btns">
          <button className={`btn-dark${added?' done':''}`} onClick={doAdd}>{added?'✓ Added to Cart':'🛒  Add to Cart'}</button>
          <button className={`btn-wl${wished?' on':''}`} onClick={()=>requireAuth(()=>toggleWish(product))}>{wished?'❤️':'♡'}</button>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:4}}>
          {['🚚 Free Shipping ₹2999+','🔄 7-Day Returns','🛡️ Secure Payment'].map(t=><span key={t} style={{fontSize:11,color:'var(--muted)',background:'var(--sand)',padding:'4px 10px',borderRadius:18,border:'1px solid var(--bdr)'}}>{t}</span>)}
        </div>

    {related.length>0&&(
      <section style={{padding:'0 60px 84px'}}>
        <div className="slabel" style={{marginBottom:28}}><span className="seye">You May Also Like</span><h2>Related Products</h2><div className="sln"/></div>
        <div className="pgrid">{related.map(p=><ProductCard key={p.id} product={p}/>)}</div>
      </section>
    )}
  </>);
}

/* ══════ CART PAGE ════════════════════════════════════════════ */
function CartPage({cart,dispatch,navigate}){
  const {toast}=useContext(ToastCtx);
  const {user}=useContext(AuthCtx);
  const SIZES=['XS','S','M','L','XL','XXL','Free Size'];
  const [step,setStep]=useState('cart');
  const [coupon,setCoupon]=useState('');const [cpnLabel,setCpnLabel]=useState('');const [discount,setDiscount]=useState(0);
  const [editIdx,setEditIdx]=useState(null);const [orderDone,setOrderDone]=useState(false);
  const [orderId]=useState('PS'+String(Date.now()).slice(-8));
  const [addrErrs,setAddrErrs]=useState({});
  const [addr,setAddr]=useState({name:user?.name||'',email:user?.email||'',phone:user?.phone||'',pincode:'',address:'',city:'',state:'',type:'Home'});
  const [pay,setPay]=useState({method:'upi',upi:'',upiApp:'',upiVerified:false,card:'',expiry:'',cvv:'',cardName:'',bank:''});
  const [payErrs,setPayErrs]=useState({});
  const [pinLoading,setPinLoading]=useState(false);
  const [pinOffices,setPinOffices]=useState([]);
  const fetchPincode=async(pin)=>{
    setPinLoading(true);
    setPinOffices([]);
    try{
      const res=await fetch('https://api.postalpincode.in/pincode/'+pin);
      const data=await res.json();
      if(data&&data[0]&&data[0].Status==='Success'&&data[0].PostOffice&&data[0].PostOffice.length>0){
        const po=data[0].PostOffice[0];
        const city=po.District&&po.District!=='NA'?po.District:po.Name;
        const state=po.State;
        setAddr(prev=>({...prev,city,state}));
        setAddrErrs(prev=>({...prev,pincode:'',city:'',state:''}));
        setPinOffices(data[0].PostOffice.map(p=>p.Name));
      }else{
        setAddrErrs(prev=>({...prev,pincode:'⚠ Pincode not found — please fill city & state manually'}));
      }
    }catch(e){
      setAddrErrs(prev=>({...prev,pincode:'⚠ Could not reach lookup service — please fill manually'}));
    }
    setPinLoading(false);
  };

  const validatePayment=()=>{
    const e={};
    if(pay.method==='upi'){
      if(!pay.upi.trim()) e.upi='Enter your UPI ID (e.g. name@okicici or 9876543210@ybl)';
      else if(!RE_UPI.test(pay.upi.trim())) e.upi='Invalid UPI ID — use format: name@bank or 10digits@bank';
    }
    if(pay.method==='card'){
      if(!RE_CARD.test(pay.card.replace(/\s/g,''))) e.card='Enter valid 16-digit card number';
      if(!pay.cardName.trim()||pay.cardName.trim().length<3) e.cardName='Enter name as on card';
      if(!RE_EXPIRY.test(pay.expiry)){e.expiry='Enter valid expiry MM/YY';}
      else{
        const [mm,yy]=pay.expiry.split('/');
        const exp=new Date(2000+parseInt(yy),parseInt(mm)-1,1);
        if(exp<new Date()) e.expiry='Card has expired';
      }
      if(!RE_CVV.test(pay.cvv)) e.cvv='Enter valid 3 or 4 digit CVV';
    }
    if(pay.method==='netbanking'){
      if(!pay.bank) e.bank='Please select your bank';
    }
    setPayErrs(e);
    return Object.keys(e).length===0;
  };
  const sub=cart.reduce((s,i)=>s+Number(i.price),0);
  const ship=sub>=2999?0:199;const cpnAmt=Math.round(sub*discount);const fest=Math.round(sub*.05);
  const codFee=pay.method==='cod'?50:0;const total=sub+ship-fest-cpnAmt+codFee;
  const applyCpn=()=>{
    const upCpn=coupon.toUpperCase();
    const userOrders=getOrders().filter(o=>o.userId===user?.id);
    const orderCount=userOrders.length;
    if(upCpn==='WELCOME15'&&orderCount===0){
      setDiscount(.15);setCpnLabel('🎉 First Order! 15% OFF Applied — Welcome to Poshak Story!');
    } else if(upCpn==='WELCOME15'&&orderCount>0){
      setCpnLabel('WELCOME15 is for first-time orders only.');setDiscount(0);
    } else if(upCpn==='LOYAL20'&&orderCount===1){
      setDiscount(.20);setCpnLabel('🌟 Welcome Back! 20% OFF Applied — Thank you for returning!');
    } else if(upCpn==='LOYAL20'&&orderCount!==1){
      setCpnLabel('LOYAL20 is for your 2nd order only.');setDiscount(0);
    } else if(upCpn==='FESTIVE30'){
      setDiscount(.30);setCpnLabel('✨ Festive Special! 30% OFF Applied!');
    } else if(upCpn==='SAVE20'){
      setDiscount(.20);setCpnLabel('💰 20% OFF Applied!');
    } else if(upCpn==='POSHAK10'){
      setDiscount(.10);setCpnLabel('🛍️ 10% OFF Applied!');
    } else {
      setCpnLabel('Invalid code. Try: WELCOME15 (1st order) · LOYAL20 (2nd order) · FESTIVE30');
      setDiscount(0);
    }
  };
  const STEPS=['Cart','Address','Payment','Confirm'];
  const stepIdx=['cart','address','payment','confirm'].indexOf(step);
  function StepBar(){
    return(
      <div className="step-bar">
        {STEPS.map((s,i)=>{
          const done=i<stepIdx,curr=i===stepIdx,pend=i>stepIdx;
          return(
            <React.Fragment key={s}>
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:5,minWidth:56}}>
                <div className={`step-dot${done?' done':curr?' curr':' pend'}`}>{done?'✓':i+1}</div>
                <span className="step-lbl" style={{color:pend?'var(--muted)':'var(--cr)',fontWeight:curr?700:400}}>{s}</span>
              </div>
              {i<STEPS.length-1&&<div className={`step-line${done?' done':''}`}/>}
            </React.Fragment>
          );
        })}
      </div>
    );
  }
  if(orderDone) return(
    <div style={{minHeight:'60vh',display:'flex',alignItems:'center',justifyContent:'center',padding:40}}>
      <div style={{background:'#fff',borderRadius:20,padding:'50px 42px',maxWidth:480,width:'100%',textAlign:'center',boxShadow:'var(--sl)',border:'1px solid var(--bdr)'}}>
        <div style={{fontSize:64,marginBottom:16}}>🎉</div>

        <div style={{background:'var(--sand)',borderRadius:10,padding:'12px 16px',margin:'14px 0',fontSize:13,color:'var(--muted)'}}>Order ID: <strong style={{color:'var(--ink)'}}>{orderId}</strong></div>
        <p style={{color:'var(--muted)',fontSize:14,lineHeight:1.8,marginBottom:8}}>Thank you, {addr.name}! Expected delivery: 5–7 business days to {addr.city}.</p>
        <button onClick={()=>navigate('track')} style={{width:'100%',background:'var(--ink)',color:'#fff',border:'none',padding:13,borderRadius:9,fontSize:13,fontWeight:600,letterSpacing:1.5,textTransform:'uppercase',marginBottom:10}}>Track Order</button>
        <button onClick={()=>{dispatch({type:'CLEAR'});navigate('home');}} style={{width:'100%',background:'var(--cr)',color:'#fff',border:'none',padding:13,borderRadius:9,fontSize:13,fontWeight:600,letterSpacing:1.5,textTransform:'uppercase'}}>Continue Shopping</button>
      </div>
    </div>
  );
  if(cart.length===0) return(<div style={{padding:56}}><div className="emc"><span className="emico">🛒</span><h3>Your cart is empty</h3><p>Explore our beautiful collections!</p><button className="btn-p" style={{margin:'0 auto'}} onClick={()=>navigate('home')}>Explore Collections</button></div></div>);

  if(step==='cart') return(
    <div>
      <div className="pgh"><span className="pg-eye">Shopping</span><h1 className="pg-ttl">Your Cart</h1><div className="pg-ln"/></div>
      <button className="back-l" onClick={()=>navigate('home')}>← Continue Shopping</button>
      <section className="cart-sec">
        <StepBar/>
        <div className="cart-lay">
          <div>
            <div className="ctw">
              {cart.map((it,i)=>(
                <div key={it.uid} style={{display:'flex',gap:14,padding:'16px 18px',borderBottom:'1px solid var(--bdr)',alignItems:'flex-start'}}>
                  <div style={{width:72,height:82,borderRadius:9,overflow:'hidden',background:'var(--sand)',flexShrink:0}}><img src={it.img} alt={it.name} style={{width:'100%',height:'100%',objectFit:'cover'}} onError={e=>{e.target.src='https://placehold.co/400x500/f5ede0/b0998a?text=Poshak+Story';}}/></div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontFamily:"'Playfair Display',serif",fontSize:15,fontWeight:600,color:'var(--ink)',marginBottom:4}}>{it.name}</div>
                    <div style={{fontSize:11,color:'var(--muted)',textTransform:'uppercase',letterSpacing:1,marginBottom:8}}>{it.sub||'Ethnic Wear'}</div>
                    <div style={{display:'flex',alignItems:'center',gap:6}}>
                      <span style={{fontSize:12,color:'var(--muted)'}}>Size:</span>
                      {editIdx===i?(
                        <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                          {SIZES.map(sz=><button key={sz} onClick={()=>{dispatch({type:'UPDATE_SIZE',uid:it.uid,size:sz});setEditIdx(null);}} style={{padding:'3px 9px',borderRadius:5,fontSize:11.5,fontWeight:it.size===sz?700:400,border:'1.5px solid '+(it.size===sz?'var(--cr)':'var(--bdr)'),background:it.size===sz?'var(--cr-l)':'transparent',color:it.size===sz?'var(--cr)':'var(--char)'}}>{sz}</button>)}
                          <button onClick={()=>setEditIdx(null)} style={{padding:'3px 8px',border:'1px solid var(--bdr)',borderRadius:5,background:'none',fontSize:11,color:'var(--muted)'}}>✕</button>
                        </div>
                      ):(
                        <button onClick={()=>setEditIdx(i)} style={{display:'inline-flex',alignItems:'center',gap:5,padding:'3px 10px',borderRadius:5,border:'1.5px solid var(--bdr)',background:'var(--sand)',fontSize:12,fontWeight:600,color:'var(--ink)'}}>{it.size||'M'} <span style={{fontSize:10,color:'var(--cr)'}}>✎ Edit</span></button>
                      )}
                    </div>
                  </div>
                  <div style={{textAlign:'right',flexShrink:0}}>
                    <div style={{fontFamily:"'Playfair Display',serif",fontSize:17,fontWeight:700,color:'var(--cr)',marginBottom:8}}>₹{Number(it.price).toLocaleString('en-IN')}</div>
                    <button className="rmb" onClick={()=>{dispatch({type:'REMOVE',uid:it.uid});toast(it.name+' removed');}}>✕</button>
                  </div>
                </div>
              ))}
              <div style={{padding:'10px 18px',borderTop:'1px solid var(--bdr)'}}><button className="chip" onClick={()=>dispatch({type:'CLEAR'})}>🗑 Clear Cart</button></div>
            </div>
            <div style={{marginTop:14,background:'#fff',borderRadius:var_rad_l,padding:20,boxShadow:'var(--ss)',border:'1px solid var(--bdr)'}}>
              <div style={{fontFamily:"'Playfair Display',serif",fontSize:17,fontWeight:600,marginBottom:12,color:'var(--ink)'}}>Apply Coupon</div>
              <div className="cpn-row"><input type="text" placeholder="e.g. FESTIVE30" value={coupon} onChange={e=>setCoupon(e.target.value.toUpperCase())}/><button onClick={applyCpn}>Apply</button></div>
              {cpnLabel&&<div style={{fontSize:13,marginTop:7,color:discount?'#16a34a':'var(--cr)',fontWeight:500}}>{cpnLabel}</div>}
              <div style={{fontSize:11.5,color:'var(--muted)',marginTop:5}}>1st order: WELCOME15 (15%) · 2nd order: LOYAL20 (20%) · Always: FESTIVE30 · SAVE20 · POSHAK10</div>
            </div>
          </div>
          <div className="csum">
            <h3>Order Summary</h3>
            <div className="srow"><span>Subtotal ({cart.length} items)</span><span>₹{sub.toLocaleString('en-IN')}</span></div>
            <div className="srow"><span>Shipping</span><span style={{color:ship===0?'#16a34a':'inherit'}}>{ship===0?'Free':'₹'+ship}</span></div>
            <div className="srow"><span>Festive Discount (5%)</span><span style={{color:'#16a34a'}}>-₹{fest.toLocaleString('en-IN')}</span></div>
            {discount>0&&<div className="srow"><span>Coupon ({Math.round(discount*100)}%)</span><span style={{color:'#16a34a'}}>-₹{cpnAmt.toLocaleString('en-IN')}</span></div>}
            <div className="stotal"><span>Total</span><span style={{color:'var(--cr)'}}>₹{total.toLocaleString('en-IN')}</span></div>
            {ship>0&&<div style={{background:'var(--sand)',borderRadius:7,padding:'8px 12px',marginTop:10,fontSize:12,color:'var(--muted)',textAlign:'center'}}>Add ₹{(2999-sub).toLocaleString('en-IN')} more for free shipping!</div>}
            <button className="chk-btn" onClick={()=>setStep('address')}>Proceed to Address →</button>
            <div style={{textAlign:'center',marginTop:12,fontSize:11,color:'var(--muted)'}}>🔒 Secure & Encrypted Checkout</div>
          </div>
        </div>
      </section>
    </div>
  );

  if(step==='address'){
    const fields=[
      {label:'Full Name',key:'name',ph:'Your full name',type:'text',full:false},
      {label:'Email Address',key:'email',ph:'you@example.com',type:'email',full:false},
      {label:'Mobile Number (+91)',key:'phone',ph:'10-digit number',type:'tel',full:false},
      {label:'Full Address',key:'address',ph:'House, Street, Area',type:'text',full:true},
      {label:'Pincode',key:'pincode',ph:'6-digit pincode',type:'text',full:false,isPincode:true},
      {label:'City',key:'city',ph:'City name',type:'text',full:false},
      {label:'State',key:'state',ph:'State name',type:'text',full:false},
    ];
    const validateAddr=()=>{
      const e={};
      if(!addr.name||addr.name.trim().length<2) e.name='Enter your full name';
      if(!RE_EMAIL.test((addr.email||'').trim())) e.email='Enter a valid email address';
      if(!RE_PHONE.test((addr.phone||'').replace(/\s/g,''))) e.phone='Valid 10-digit number starting 6-9';
      if(!addr.address||addr.address.trim().length<5) e.address='Enter a complete address';
      if(!/^\d{6}$/.test((addr.pincode||'').trim())) e.pincode='Enter valid 6-digit pincode';
      if(!addr.city||addr.city.trim().length<2) e.city='Enter city name';
      if(!addr.state||addr.state.trim().length<2) e.state='Enter state name';
      setAddrErrs(e);return Object.keys(e).length===0;
    };
    return(
      <div>
        <div className="pgh"><span className="pg-eye">Shopping</span><h1 className="pg-ttl">Delivery Address</h1><div className="pg-ln"/></div>
        <button className="back-l" onClick={()=>setStep('cart')}>← Back to Cart</button>
        <section className="cart-sec"><StepBar/>
          <div className="cart-lay">
            <div style={{background:'#fff',borderRadius:var_rad_l,padding:28,boxShadow:'var(--ss)',border:'1px solid var(--bdr)'}}>
              <h3 style={{fontFamily:"'Playfair Display',serif",fontSize:20,fontWeight:700,color:'var(--ink)',marginBottom:22}}>Shipping Address</h3>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
                {fields.map(f=>{
                  const hasErr=addrErrs[f.key];
                  return(
                    <div key={f.key} style={{gridColumn:f.full?'1/-1':'auto'}}>
                      <label style={{display:'block',fontSize:11.5,fontWeight:600,color:hasErr?'#ef4444':'var(--muted)',letterSpacing:.6,textTransform:'uppercase',marginBottom:6}}>
                {f.label}{f.isPincode&&pinLoading&&<span style={{color:'var(--cr)',fontSize:10.5,marginLeft:8,fontWeight:500}}>🔍 Looking up…</span>}{f.isPincode&&!pinLoading&&pinOffices.length>0&&<span style={{color:'#16a34a',fontSize:10.5,marginLeft:8,fontWeight:500}}>✓ Found {pinOffices.length} area{pinOffices.length>1?'s':''}</span>}
              </label>
                      <input type={f.type} placeholder={f.ph} value={addr[f.key]}
                        maxLength={f.key==='phone'?10:undefined}
                        onChange={e=>{
                  const v=f.key==='phone'?e.target.value.replace(/\D/g,''):e.target.value;
                  setAddr(prev=>({...prev,[f.key]:v}));
                  setAddrErrs(prev=>({...prev,[f.key]:''}));
                  if(f.isPincode&&v.length<6) setPinOffices([]);
                  if(f.isPincode&&v.length===6) fetchPincode(v);
                }}
                        style={{width:'100%',padding:'11px 14px',border:'1.5px solid '+(hasErr?'#ef4444':'var(--bdr)'),borderRadius:9,fontSize:13.5,outline:'none',background:hasErr?'#fff8f8':'var(--sand)',transition:'border-color .2s'}}
                        onFocus={e=>e.target.style.borderColor=hasErr?'#ef4444':'var(--cr)'}
                        onBlur={e=>e.target.style.borderColor=hasErr?'#ef4444':'var(--bdr)'}/>
                      {hasErr&&<span style={{fontSize:11.5,color:'#ef4444',marginTop:4,display:'block'}}>⚠ {hasErr}</span>}
                    </div>
                  );
                })}
              </div>
              <div style={{marginTop:18}}>
                <label style={{display:'block',fontSize:11.5,fontWeight:600,color:'var(--muted)',letterSpacing:.6,textTransform:'uppercase',marginBottom:10}}>Address Type</label>
                <div style={{display:'flex',gap:10}}>
                  {['Home','Work','Other'].map(t=>(
                    <button key={t} onClick={()=>setAddr(prev=>({...prev,type:t}))} style={{padding:'8px 20px',borderRadius:7,fontSize:13,fontWeight:addr.type===t?700:400,border:'1.5px solid '+(addr.type===t?'var(--cr)':'var(--bdr)'),background:addr.type===t?'var(--cr-l)':'transparent',color:addr.type===t?'var(--cr)':'var(--char)',transition:'all .2s'}}>{t}</button>
                  ))}
                </div>
              </div>
              {pinOffices.length>0&&(
                <div style={{marginTop:16,padding:'14px 16px',background:'var(--sand)',borderRadius:10,border:'1px solid var(--bdr)'}}>
                  <div style={{fontSize:11.5,fontWeight:700,color:'var(--muted)',letterSpacing:.8,textTransform:'uppercase',marginBottom:10}}>📍 Post Offices in {addr.pincode}</div>
                  <div style={{display:'flex',gap:7,flexWrap:'wrap'}}>
                    {pinOffices.map(name=>(
                      <button key={name} onClick={()=>setAddr(prev=>({...prev,address:prev.address?prev.address:name+', '+addr.city}))}

                </div>

            </div>
            <div className="csum">
              <h3>Items ({cart.length})</h3>
              {cart.map(it=>(
                <div key={it.uid} style={{display:'flex',gap:10,marginBottom:12,paddingBottom:12,borderBottom:'1px solid var(--bdr)',alignItems:'center'}}>
                  <div style={{width:44,height:50,borderRadius:7,overflow:'hidden',background:'var(--sand)',flexShrink:0}}><img src={it.img} alt={it.name} style={{width:'100%',height:'100%',objectFit:'cover'}} onError={e=>{e.target.src='https://placehold.co/400x500/f5ede0/b0998a?text=Poshak+Story';}}/></div>
                  <div style={{flex:1}}><div style={{fontSize:12.5,fontWeight:600,color:'var(--ink)'}}>{it.name}</div><div style={{fontSize:11,color:'var(--muted)'}}>Size: {it.size||'M'}</div></div>
                  <div style={{fontSize:13,fontWeight:700,color:'var(--cr)',flexShrink:0}}>₹{Number(it.price).toLocaleString('en-IN')}</div>
                </div>
              ))}
              <div className="stotal"><span>Total</span><span style={{color:'var(--cr)'}}>₹{total.toLocaleString('en-IN')}</span></div>
              <button className="chk-btn" onClick={()=>{if(validateAddr())setStep('payment');}}>Proceed to Payment →</button>
            </div>
          </div>
        </section>
      </div>
    );
  }

  if(step==='payment') return(
    <div>
      <div className="pgh"><span className="pg-eye">Shopping</span><h1 className="pg-ttl">Payment</h1><div className="pg-ln"/></div>
      <button className="back-l" onClick={()=>setStep('address')}>← Back to Address</button>
      <section className="cart-sec"><StepBar/>

          <div style={{background:'#fff',borderRadius:var_rad_l,padding:28,boxShadow:'var(--ss)',border:'1px solid var(--bdr)'}}>

                {id:'upi',     label:'UPI / Google Pay / PhonePe', note:'Instant transfer · 0% fees',         noteColor:'#16a34a', icon:'📲'},
                {id:'card',    label:'Credit / Debit Card',         note:'Visa · Mastercard · Rupay · Amex',   noteColor:'var(--muted)', icon:'💳'},

                      <div style={{fontSize:11.5,color:m.noteColor,marginTop:2}}>{m.note}</div>
                    </div>
                    <div style={{width:18,height:18,borderRadius:'50%',flexShrink:0,
                      border:'2px solid '+(sel?'var(--cr)':'var(--bdr)'),

            </div>

            {/* ── UPI ─────────────────────────────────────── */}

                <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:16}}>
                  {[
                    {name:'Google Pay',  short:'GPay',   bg:'#fff',   border:'#4285F4', emoji:'🅖'},
                    {name:'PhonePe',     short:'PhonePe',bg:'#5f259f',border:'#5f259f', emoji:'📲', light:true},
                    {name:'Paytm',       short:'Paytm',  bg:'#00B9F1',border:'#00B9F1', emoji:'💙', light:true},
                    {name:'BHIM UPI',    short:'BHIM',   bg:'#ff6600',border:'#ff6600', emoji:'🇮🇳',light:true},
                    {name:'Amazon Pay',  short:'Amazon', bg:'#fff',   border:'#ff9900', emoji:'📦'},
                  ].map(app=>{

                      <button key={app.name}

                        <span style={{fontSize:22}}>{app.emoji}</span>
                        <span style={{fontSize:10.5,fontWeight:700,color:sel?'var(--cr)':app.light&&!sel?'#fff':'var(--char)'}}>{app.short}</span>
                      </button>

                </div>
                <div style={{fontSize:12,fontWeight:700,color:'var(--muted)',letterSpacing:.8,textTransform:'uppercase',marginBottom:8}}>

                <div style={{position:'relative'}}>

                  <div style={{display:'flex',justifyContent:'space-between',fontSize:12,letterSpacing:1}}>

                </div>

                    <input type="text" placeholder="1234 5678 9012 3456" maxLength={19} value={pay.card}
                      onChange={e=>{
                        const v=e.target.value.replace(/\D/g,'').slice(0,16);
                        const sp=v.match(/.{1,4}/g);
                        setPay(p=>({...p,card:sp?sp.join(' '):''}));
                        setPayErrs(p=>({...p,card:''}));
                      }}
                      style={{width:'100%',padding:'12px 14px',border:'1.5px solid '+(payErrs.card?'#ef4444':'var(--bdr)'),borderRadius:9,fontSize:15,outline:'none',background:'#fff',letterSpacing:3,fontFamily:'DM Mono,monospace'}}/>
                    {payErrs.card&&<span style={{fontSize:11.5,color:'#ef4444',marginTop:4,display:'block'}}>⚠ {payErrs.card}</span>}
                  </div>
                  <div style={{gridColumn:'1/-1'}}>
                    <label style={{display:'block',fontSize:11,fontWeight:600,color:payErrs.cardName?'#ef4444':'var(--muted)',textTransform:'uppercase',letterSpacing:.6,marginBottom:6}}>Name on Card</label>
                    <input type="text" placeholder="Name exactly as on card" value={pay.cardName}
                      onChange={e=>{setPay(p=>({...p,cardName:e.target.value.toUpperCase()}));setPayErrs(p=>({...p,cardName:''}));}}
                      style={{width:'100%',padding:'12px 14px',border:'1.5px solid '+(payErrs.cardName?'#ef4444':'var(--bdr)'),borderRadius:9,fontSize:13.5,outline:'none',background:'#fff'}}/>
                    {payErrs.cardName&&<span style={{fontSize:11.5,color:'#ef4444',marginTop:4,display:'block'}}>⚠ {payErrs.cardName}</span>}
                  </div>
                  <div>
                    <label style={{display:'block',fontSize:11,fontWeight:600,color:payErrs.expiry?'#ef4444':'var(--muted)',textTransform:'uppercase',letterSpacing:.6,marginBottom:6}}>Expiry (MM/YY)</label>
                    <input type="text" placeholder="MM/YY" maxLength={5} value={pay.expiry}
                      onChange={e=>{
                        let v=e.target.value.replace(/[^0-9/]/g,'');
                        if(v.length===2&&!v.includes('/')&&pay.expiry.length===1) v=v+'/';
                        setPay(p=>({...p,expiry:v}));setPayErrs(p=>({...p,expiry:''}));
                      }}
                      style={{width:'100%',padding:'12px 14px',border:'1.5px solid '+(payErrs.expiry?'#ef4444':'var(--bdr)'),borderRadius:9,fontSize:14,outline:'none',background:'#fff',fontFamily:'DM Mono,monospace'}}/>
                    {payErrs.expiry&&<span style={{fontSize:11.5,color:'#ef4444',marginTop:4,display:'block'}}>⚠ {payErrs.expiry}</span>}
                  </div>
                  <div>
                    <label style={{display:'block',fontSize:11,fontWeight:600,color:payErrs.cvv?'#ef4444':'var(--muted)',textTransform:'uppercase',letterSpacing:.6,marginBottom:6}}>CVV / CVC</label>
                    <input type="password" placeholder="3 or 4 digits" maxLength={4} value={pay.cvv}
                      onChange={e=>{setPay(p=>({...p,cvv:e.target.value.replace(/\D/g,'')}));setPayErrs(p=>({...p,cvv:''}));}}
                      style={{width:'100%',padding:'12px 14px',border:'1.5px solid '+(payErrs.cvv?'#ef4444':'var(--bdr)'),borderRadius:9,fontSize:14,outline:'none',background:'#fff',fontFamily:'DM Mono,monospace'}}/>
                    {payErrs.cvv&&<span style={{fontSize:11.5,color:'#ef4444',marginTop:4,display:'block'}}>⚠ {payErrs.cvv}</span>}
                  </div>
                </div>
                <div style={{marginTop:12,display:'flex',gap:6,alignItems:'center'}}>
                  <span style={{fontSize:11,color:'var(--muted)'}}>We accept:</span>
                  {['VISA','MC','RUPAY','AMEX'].map(c=><span key={c} style={{fontSize:10,fontWeight:700,padding:'2px 7px',borderRadius:4,background:'var(--ink)',color:'#fff',letterSpacing:.5}}>{c}</span>)}
                </div>
              </div>
            )}

            {/* ── NET BANKING ──────────────────────────────── */}
            {pay.method==='netbanking'&&(
              <div style={{padding:18,background:'var(--sand)',borderRadius:12,border:'1px solid '+(payErrs.bank?'#ef4444':'var(--bdr)')}}>
                <div style={{fontSize:12,fontWeight:700,color:'var(--muted)',letterSpacing:.8,textTransform:'uppercase',marginBottom:12}}>Select Your Bank</div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(90px,1fr))',gap:8}}>
                  {['SBI','HDFC','ICICI','Axis Bank','Kotak','PNB','Yes Bank','IndusInd','Bank of Baroda','Canara Bank','Other'].map(b=>(
                    <button key={b} onClick={()=>{setPay(p=>({...p,bank:b}));setPayErrs(p=>({...p,bank:''}));}}
                      style={{padding:'10px 8px',borderRadius:9,fontSize:12,fontWeight:pay.bank===b?700:400,
                        border:'1.5px solid '+(pay.bank===b?'var(--cr)':'var(--bdr)'),
                        background:pay.bank===b?'var(--cr-l)':'#fff',
                        color:pay.bank===b?'var(--cr)':'var(--char)',transition:'all .18s',cursor:'pointer'}}>
                      {b}
                    </button>
                  ))}
                </div>
                {payErrs.bank&&<span style={{fontSize:11.5,color:'#ef4444',marginTop:8,display:'block'}}>⚠ {payErrs.bank}</span>}
                {pay.bank&&<div style={{marginTop:12,padding:'10px 14px',background:'#fff',borderRadius:8,fontSize:13,color:'var(--ink)',border:'1px solid var(--bdr)'}}>
                  You will be redirected to <strong>{pay.bank}</strong> net banking portal to complete payment.
                </div>}
              </div>
            )}

            {/* ── COD ──────────────────────────────────────── */}
            {pay.method==='cod'&&(
              <div style={{padding:18,background:'var(--sand)',borderRadius:12,border:'1px solid var(--bdr)'}}>
                <div style={{display:'flex',gap:14,alignItems:'flex-start'}}>
                  <span style={{fontSize:32}}>💵</span>
                  <div>
                    <div style={{fontWeight:600,fontSize:14,color:'var(--ink)',marginBottom:6}}>Cash on Delivery</div>
                    <div style={{fontSize:13.5,color:'var(--char)',lineHeight:1.8}}>
                      Pay in cash when your order arrives. A handling fee of <strong>₹50</strong> is added.
                      Available on orders up to <strong>₹10,000</strong>.
                    </div>
                    <div style={{marginTop:10,padding:'8px 12px',background:'#fff8f0',borderRadius:7,fontSize:12.5,color:'#c97a00',border:'1px solid #f5d98a'}}>
                      💡 Tip: Pay online to save ₹50 and get faster processing.
                    </div>
                  </div>
                </div>
              </div>
            )}

          </div>
          <div className="csum">
            <h3>Order Total</h3>
            <div className="srow"><span>Items ({cart.length})</span><span>₹{sub.toLocaleString('en-IN')}</span></div>
            <div className="srow"><span>Shipping</span><span style={{color:ship===0?'#16a34a':'inherit'}}>{ship===0?'🎁 Free':'₹'+ship}</span></div>
            <div className="srow"><span>Festive Discount (5%)</span><span style={{color:'#16a34a'}}>-₹{fest.toLocaleString('en-IN')}</span></div>
            {discount>0&&<div className="srow"><span>Coupon ({Math.round(discount*100)}%)</span><span style={{color:'#16a34a'}}>-₹{cpnAmt.toLocaleString('en-IN')}</span></div>}
            {pay.method==='cod'&&<div className="srow"><span>COD Fee</span><span>₹50</span></div>}
            <div className="stotal"><span>Total</span><span style={{color:'var(--cr)'}}>₹{total.toLocaleString('en-IN')}</span></div>
            <div style={{background:'var(--sand)',borderRadius:8,padding:'9px 12px',marginTop:10,fontSize:12,color:'var(--muted)',lineHeight:1.6}}>
              📍 Delivering to: <strong style={{color:'var(--ink)'}}>{addr.name||'—'}</strong>, {addr.city||'—'}
            </div>
            <button className="chk-btn" onClick={()=>{if(validatePayment())setStep('confirm');}}>Review Order →</button>
            <div style={{textAlign:'center',marginTop:10,fontSize:11,color:'var(--muted)'}}>🔒 256-bit SSL Encrypted · PCI-DSS Compliant</div>
          </div>
        </div>
      </section>
    </div>
  );

  return(
    <div>
      <div className="pgh"><span className="pg-eye">Shopping</span><h1 className="pg-ttl">Review & Confirm</h1><div className="pg-ln"/></div>
      <button className="back-l" onClick={()=>setStep('payment')}>← Back to Payment</button>
      <section className="cart-sec"><StepBar/>
        <div className="cart-lay">
          <div style={{display:'flex',flexDirection:'column',gap:16}}>
            <div style={{background:'#fff',borderRadius:var_rad_l,padding:24,boxShadow:'var(--ss)',border:'1px solid var(--bdr)'}}>
              <h4 style={{fontFamily:"'Playfair Display',serif",fontSize:18,fontWeight:700,color:'var(--ink)',marginBottom:16}}>Order Items</h4>
              {cart.map((it,i)=>(
                <div key={it.uid} style={{display:'flex',gap:12,paddingBottom:12,marginBottom:12,borderBottom:i<cart.length-1?'1px solid var(--bdr)':'none',alignItems:'center'}}>
                  <div style={{width:52,height:60,borderRadius:8,overflow:'hidden',background:'var(--sand)',flexShrink:0}}><img src={it.img} alt={it.name} style={{width:'100%',height:'100%',objectFit:'cover'}} onError={e=>{e.target.src='https://placehold.co/400x500/f5ede0/b0998a?text=Poshak+Story';}}/></div>
                  <div style={{flex:1}}><div style={{fontWeight:600,fontSize:14,color:'var(--ink)'}}>{it.name}</div><div style={{fontSize:12,color:'var(--muted)',marginTop:2}}>Size: {it.size||'M'}</div></div>
                  <div style={{fontFamily:"'Playfair Display',serif",fontSize:16,fontWeight:700,color:'var(--cr)'}}>₹{Number(it.price).toLocaleString('en-IN')}</div>
                </div>
              ))}
            </div>
            <div style={{background:'#fff',borderRadius:var_rad_l,padding:24,boxShadow:'var(--ss)',border:'1px solid var(--bdr)'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
                <h4 style={{fontFamily:"'Playfair Display',serif",fontSize:18,fontWeight:700,color:'var(--ink)'}}>Delivery Address</h4>
                <button onClick={()=>setStep('address')} style={{background:'none',border:'1px solid var(--cr)',color:'var(--cr)',padding:'4px 12px',borderRadius:6,fontSize:12}}>Edit</button>
              </div>
              <div style={{fontSize:14,color:'var(--char)',lineHeight:2}}><strong>{addr.name}</strong><br/>{addr.email}<br/>{addr.address}<br/>{addr.city}, {addr.state} — {addr.pincode}<br/>📱 +91 {addr.phone}</div>
            </div>
            <div style={{background:'#fff',borderRadius:var_rad_l,padding:24,boxShadow:'var(--ss)',border:'1px solid var(--bdr)'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
                <h4 style={{fontFamily:"'Playfair Display',serif",fontSize:18,fontWeight:700,color:'var(--ink)'}}>Payment</h4>
                <button onClick={()=>setStep('payment')} style={{background:'none',border:'1px solid var(--cr)',color:'var(--cr)',padding:'4px 12px',borderRadius:6,fontSize:12}}>Edit</button>
              </div>
              <div style={{fontSize:14,color:'var(--char)'}}>
                {pay.method==='upi'&&(`${pay.upiApp?pay.upiApp+' · ':''}UPI: ${pay.upi||'Not entered'}`)}
                {pay.method==='card'&&('Card ending ****'+(pay.card.replace(/ /g,'').slice(-4)||'—'))}
                {pay.method==='netbanking'&&('Net Banking: '+(pay.bank||'Not selected'))}
                {pay.method==='cod'&&'Cash on Delivery (₹50 COD fee)'}
              </div>
            </div>
          </div>
          <div className="csum">
            <h3>Final Bill</h3>
            <div className="srow"><span>Subtotal</span><span>₹{sub.toLocaleString('en-IN')}</span></div>
            <div className="srow"><span>Shipping</span><span style={{color:ship===0?'#16a34a':'inherit'}}>{ship===0?'Free':'₹'+ship}</span></div>
            <div className="srow"><span>Festive Discount (5%)</span><span style={{color:'#16a34a'}}>-₹{fest.toLocaleString('en-IN')}</span></div>
            {discount>0&&<div className="srow"><span>Coupon</span><span style={{color:'#16a34a'}}>-₹{cpnAmt.toLocaleString('en-IN')}</span></div>}
            {pay.method==='cod'&&<div className="srow"><span>COD Fee</span><span>₹50</span></div>}
            <div className="stotal"><span>Total</span><span style={{color:'var(--cr)'}}>₹{total.toLocaleString('en-IN')}</span></div>
            <button className="chk-btn" style={{background:'linear-gradient(135deg,var(--cr),var(--cr-d))'}} onClick={()=>{
                const orderData={
                  id: orderId,
                  placedAt: new Date().toISOString(),
                  items: cart.map(i=>({name:i.name,price:i.price,img:i.img,size:i.size||'M',sub:i.sub})),
                  addr: {...addr},
                  pay: {method:pay.method, ref: pay.method==='upi'?pay.upi : pay.method==='card'?('****'+pay.card.replace(/ /g,'').slice(-4)) : pay.method==='netbanking'?pay.bank : 'COD'},
                  total, sub, ship, fest, cpnAmt, discount,
                  status: 'Order Placed',
                  userId: user?.id || null,
                };
                saveOrder(orderData);
                setOrderDone(true);
                window.scrollTo({top:0});
              }}>Place Order ✓</button>
            <div style={{textAlign:'center',marginTop:10,fontSize:11,color:'var(--muted)'}}>Protected by Poshak Story Guarantee</div>
          </div>
        </div>
      </section>
    </div>
  );
}

  const {dispatch}=useContext(CartCtx);const {toast}=useContext(ToastCtx);const navigate=useContext(NavCtx);
  const move=p=>{dispatch({type:'ADD',item:{id:p.id,name:p.name,price:p.price,img:p.img,uid:Date.now()+Math.random()}});toast(p.name);toggleWish(p);};

/* ══════ STORE HOURS CLOCK ════════════════════════════════════ */
function drawStoreClock(canvas,size){
  const ctx=canvas.getContext('2d'),cx=size/2,cy=size/2,r=size/2-3,now=new Date();
  const hr=now.getHours()%12+now.getMinutes()/60,mn=now.getMinutes()+now.getSeconds()/60,sc=now.getSeconds()+now.getMilliseconds()/1000;
  ctx.clearRect(0,0,size,size);
  const bg=ctx.createRadialGradient(cx,cy-r*.1,r*.05,cx,cy,r);bg.addColorStop(0,'#2d1e10');bg.addColorStop(1,'#140e06');
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=bg;ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle='#c9922a';ctx.lineWidth=2.5;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,r*.87,0,Math.PI*2);ctx.strokeStyle='rgba(201,146,42,.2)';ctx.lineWidth=1;ctx.stroke();
  for(let i=0;i<12;i++){const a=(i/12)*Math.PI*2-Math.PI/2,maj=i%3===0;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r*(maj?.71:.8),cy+Math.sin(a)*r*(maj?.71:.8));ctx.lineTo(cx+Math.cos(a)*r*.87,cy+Math.sin(a)*r*.87);ctx.strokeStyle=maj?'#c9922a':'rgba(201,146,42,.4)';ctx.lineWidth=maj?2.5:1.2;ctx.lineCap='round';ctx.stroke();}
  function hand(angle,len,w,color){ctx.beginPath();ctx.moveTo(cx-Math.cos(angle)*len*.2,cy-Math.sin(angle)*len*.2);ctx.lineTo(cx+Math.cos(angle)*len,cy+Math.sin(angle)*len);ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.stroke();}
  hand((hr/12)*Math.PI*2-Math.PI/2,r*.48,4.5,'#e8c06a');
  hand((mn/60)*Math.PI*2-Math.PI/2,r*.62,3,'#ffffff');
  hand((sc/60)*Math.PI*2-Math.PI/2,r*.68,1.5,'#b5121b');
  ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.fillStyle='#c9922a';ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,2.5,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
}
function StoreHoursClock(){
  const canvasRef=useRef(null),rafRef=useRef(null);
  const [timeStr,setTimeStr]=useState('');const [dateStr,setDateStr]=useState('');
  const [isOpen,setIsOpen]=useState(false);const [statusMsg,setStatusMsg]=useState('');
  const SIZE=128;
  useEffect(()=>{
    const canvas=canvasRef.current;if(!canvas)return;
    canvas.width=SIZE;canvas.height=SIZE;
    const tick=()=>{
      const now=new Date();drawStoreClock(canvas,SIZE);
      const hh=String(now.getHours()).padStart(2,'0'),mm=String(now.getMinutes()).padStart(2,'0'),ss=String(now.getSeconds()).padStart(2,'0'),ap=now.getHours()>=12?'PM':'AM';
      setTimeStr(`${hh}:${mm}:${ss} ${ap}`);
      setDateStr(`${FULL_DAYS[now.getDay()]}, ${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()}`);
      const today=STORE_HOURS[now.getDay()],h=now.getHours()+now.getMinutes()/60,open=h>=today.open&&h<today.close;
      setIsOpen(open);
      if(open){const ml=Math.round((today.close-h)*60);setStatusMsg(ml<=60?`Closing in ${ml} min`:`Open until ${today.close>12?today.close-12:today.close}:00 ${today.close>=12?'PM':'AM'}`);}
      else{let next=null;for(let d=1;d<=7;d++){const idx=(now.getDay()+d)%7;next={...STORE_HOURS[idx],label:d===1?'Tomorrow':FULL_DAYS[(now.getDay()+d)%7]};break;}setStatusMsg(next?`Opens ${next.label} at ${next.open}:00 AM`:'Check back soon');}
      rafRef.current=requestAnimationFrame(tick);
    };
    tick();return()=>cancelAnimationFrame(rafRef.current);
  },[]);
  return(
    <div className="store-clock-bar">
      <div className="sc-canvas-wrap"><canvas ref={canvasRef} width={SIZE} height={SIZE}/><div className={`sc-status-dot ${isOpen?'open':'closed'}`}/></div>
      <div className="sc-info">
        <div className="sc-time">{timeStr}</div>
        <div className="sc-date">{dateStr}</div>
        <div className={`sc-badge ${isOpen?'open':'closed'}`}><span style={{fontSize:8}}>●</span>{isOpen?'Store Open Now':'Store Closed'}</div>
        <div className="sc-msg">{statusMsg}</div>
      </div>
      <div className="sc-hours">
        <div className="sc-hours-title">Store Hours · IST</div>
        {STORE_HOURS.map((d,i)=>{const today=new Date().getDay()===i;return(<div key={d.day} className={`sc-hour-row${today?' today':''}`}><span className="day-label">{today?<strong>{d.day}</strong>:d.day}</span><span className="time-label">{`${d.open>12?d.open-12:d.open}${d.open>=12?'pm':'am'} – ${d.close>12?d.close-12:d.close}${d.close>=12?'pm':'am'}`}</span></div>);})}
      </div>
    </div>
  );
}

  return(<>
    <HeroBanner/>
    <div className="offers"><div className="off-t">{[...offerItems,...offerItems].map((t,i)=><span key={i}>{t}&nbsp;&nbsp;<span style={{opacity:.3}}>|</span>&nbsp;&nbsp;</span>)}</div></div>
    <section className="cat-sec">
      <div className="slabel"><span className="seye">Shop by Category</span><h2>Find Your Perfect Ensemble</h2><div className="sln"/></div>
      <div className="cat-grid">{cats.map(c=><button key={c.r} className="cat-c" onClick={()=>navigate(c.r)}><img src={c.img} alt={c.l}/><div className="cat-ov"><h3>{c.l}</h3><p>{c.s}</p></div><div className="cat-arr">→</div></button>)}</div>
