/* ══════ SCROLL TOP ═══════════════════════════════════════════ */
function ScrollTop(){
  const [vis,setVis]=useState(false);
  useEffect(()=>{const h=()=>setVis(window.scrollY>400);window.addEventListener('scroll',h);return()=>window.removeEventListener('scroll',h);},[]);
  if(!vis)return null;
  return <button className="st-btn" onClick={()=>window.scrollTo({top:0,behavior:'smooth'})}>↑</button>;
}

/* ══════ APP ══════════════════════════════════════════════════ */
const var_rad_l = '20px'; // CSS var fallback for JSX inline styles

function App(){
  const [user,setUser]         = useState(()=>getSavedUser());
  const [authModal,setAuthModal] = useState(null);
  const [page,setPage]  = useState('home');
  const [tmsg,setTmsg]  = useState('');const [tshow,setTshow]=useState(false);const tr=useRef(null);

  // Cart scoped to logged-in user's email
  const [cart,dispatch] = useReducer(cartReducer, [], ()=>{
    const u=getSavedUser();
    if(!u) return [];
    try{ return JSON.parse(localStorage.getItem('ps_cart_'+u.email)||'[]'); }catch{ return []; }
  });

  // Wishlist scoped to logged-in user's email
  const [wishlist,setWishlist] = useState(()=>{
    const u=getSavedUser();
    if(!u) return [];
    try{ return JSON.parse(localStorage.getItem('ps_wl_'+u.email)||'[]'); }catch{ return []; }
  });

  // Auto-save cart whenever it changes
  useEffect(()=>{
    if(user) localStorage.setItem('ps_cart_'+user.email, JSON.stringify(cart));
  },[cart, user]);

  // Auto-save wishlist whenever it changes
  useEffect(()=>{
    if(user) localStorage.setItem('ps_wl_'+user.email, JSON.stringify(wishlist));
  },[wishlist, user]);

  const navigate = useCallback((route)=>{setPage(route);window.scrollTo({top:0,behavior:'smooth'});},[]);
  const toast    = useCallback((msg)=>{setTmsg(msg);setTshow(true);clearTimeout(tr.current);tr.current=setTimeout(()=>setTshow(false),3200);},[]);
  const toggleWish = useCallback((product)=>{setWishlist(prev=>{const exists=prev.some(w=>w.id===product.id);return exists?prev.filter(w=>w.id!==product.id):[...prev,product];});},[]);
  const logout   = useCallback(()=>{localStorage.removeItem('ps_logged_user');setUser(null);dispatch({type:'CLEAR'});setWishlist([]);navigate('home');toast('Logged out successfully.');},[]);
  const requireAuth = useCallback((cb)=>{if(user)cb();else setAuthModal('login');},[user]);
  const doSearch = useCallback((q)=>{setPage('search:'+q);window.scrollTo({top:0,behavior:'smooth'});},[]);

  // When user logs in, load their saved cart and wishlist
  const handleSetUser = useCallback((u)=>{
    setUser(u);
    if(u){
      try{
        const savedCart=JSON.parse(localStorage.getItem('ps_cart_'+u.email)||'[]');
        const savedWish=JSON.parse(localStorage.getItem('ps_wl_'+u.email)||'[]');
        dispatch({type:'CLEAR'});
        savedCart.forEach(item=>dispatch({type:'ADD',item}));
        setWishlist(savedWish);
      }catch(e){}
    }
  },[]);

  const renderPage=()=>{
    if(page==='home')            return <HomePage/>;
    if(page==='cart')            return <CartPage cart={cart} dispatch={dispatch} navigate={navigate}/>;
    if(page==='wishlist')        return <WishlistPage/>;
    if(page==='track')           return <TrackPage/>;
    if(page==='size-guide')      return <SizeGuidePage/>;
    if(page==='shipping')        return <ShippingPage/>;
    if(page==='returns')         return <ReturnsPage/>;
    if(page.startsWith('detail:')) return <DetailPage productId={page.slice(7)}/>;
    if(page.startsWith('search:')) return <SearchPage query={page.slice(7)}/>;
    if(page==='sale')            return <SalePage/>;
    if(page==='girls')           return <ProductListPage cat='girls'/>;
    if(page==='boys')            return <ProductListPage cat='boys'/>;
    if(CATS[page])               return <ProductListPage cat={page}/>;
    return <HomePage/>;
  };

  const cartCtx  = useMemo(()=>({cart,dispatch}),[cart]);
  const toastCtx = useMemo(()=>({toast}),[toast]);
  const wishCtx  = useMemo(()=>({wishlist,toggleWish}),[wishlist,toggleWish]);
  const authCtx  = useMemo(()=>({user,setUser:handleSetUser,requireAuth,logout,openAuth:setAuthModal}),[user,handleSetUser,requireAuth,logout]);

  return(
    <AuthCtx.Provider value={authCtx}>
    <CartCtx.Provider value={cartCtx}>
    <ToastCtx.Provider value={toastCtx}>
    <WishCtx.Provider value={wishCtx}>
    <NavCtx.Provider value={navigate}>
      <CustomCursor/>
      <Topbar doSearch={doSearch}/>
      <main className="page-in" key={page}>{renderPage()}</main>
      <Footer/>
      <ScrollTop/>
      <Toast msg={tmsg} show={tshow}/>
      {authModal&&<AuthModal mode={authModal} onClose={()=>setAuthModal(null)}/>}
    </NavCtx.Provider>
    </WishCtx.Provider>
    </ToastCtx.Provider>
    </CartCtx.Provider>
    </AuthCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
